# Product Page Optimization treatment: lead with copying a saved card number.
# config.yaml stays the control and the approved store sequence.
# Koubou places each 2.6 capture in its real iPhone 17 Pro Max frame.
project:
  name: "Holder copy-first PPO treatment"
  output_dir: "output/ppo-copy-first"
  device: "iPhone 17 Pro Max - Silver - Portrait"
  output_size: "iPhone6_9"
  parallel_workers: 3

screenshots:
  01_copy_number:
    template: "templates/framed/01_copy_number.html"
    frame: true
    variables:
      headline: "Your card number, ready to copy."
      subtitle: "Saved details, even without internet."
    assets:
      app_screenshot: "captures/en-US/2.6/card-details-copied.png"

  02_scan_card:
    template: "templates/framed/02_scan_card.html"
    frame: true
    variables:
      headline: "Scan it. Skip the typing."
      subtitle: "Prefill the number, name, and expiry."
    assets:
      app_screenshot: "captures/en-US/2.6/scanner.png"

  03_cards_together:
    template: "templates/framed/03_cards_together.html"
    frame: true
    variables:
      headline: "Your cards. One private place."
      subtitle: "Credit, debit, IDs, and more."
    assets:
      app_screenshot: "captures/en-US/2.6/home.png"
