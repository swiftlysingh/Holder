# Product Page Optimization treatment: lead with copying a saved card number.
# config.yaml stays the control and the approved store sequence.
project:
  name: "Holder copy-first PPO treatment"
  output_dir: "output/ppo-copy-first"
  device: "iPhone 17 Pro Max - Portrait"
  output_size: "iPhone6_9"
  parallel_workers: 3

screenshots:
  01_copy_number:
    template: "templates/01_copy_number.html"
    frame: false
    variables:
      headline: "Your card number, ready to copy."
      subtitle: "Saved details, even without internet."
    assets:
      app_screenshot: "captures/en-US/card-details-copied.png"
      app_icon: "../../cards/Assets.xcassets/AppIcon.appiconset/1024.png"

  02_scan_card:
    template: "templates/02_scan_card.html"
    frame: false
    variables:
      headline: "Scan it. Skip the typing."
      subtitle: "Prefill the number, name, and expiry."
    assets:
      app_screenshot: "captures/en-US/scanner-sheet.png"
      app_icon: "../../cards/Assets.xcassets/AppIcon.appiconset/1024.png"

  03_cards_together:
    template: "templates/01_cards_together.html"
    frame: false
    variables:
      headline: "Your cards. One private place."
      subtitle: "Credit, debit, IDs, and more."
    assets:
      app_screenshot: "captures/en-US/home.png"
      app_icon: "../../cards/Assets.xcassets/AppIcon.appiconset/1024.png"
