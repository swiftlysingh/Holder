<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      position: relative;
      color: #edf8f1;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background:
        radial-gradient(circle at 84% 34%, rgba(183, 243, 207, .15), transparent 28%),
        linear-gradient(160deg, #12493e 0%, #103b32 50%, #121c19 100%);
    }
    body::after {
      content: "";
      position: absolute;
      width: 39vw;
      height: 39vw;
      right: -16vw;
      top: 19vh;
      border: 1px solid rgba(183, 243, 207, .18);
      border-radius: 50%;
      box-shadow: 0 0 0 9vw rgba(183, 243, 207, .025), 0 0 0 19vw rgba(183, 243, 207, .02);
    }
    .brand {
      position: absolute;
      z-index: 5;
      top: 4.7%;
      left: 7%;
      display: flex;
      align-items: center;
      gap: 2.3vw;
      color: #a7c0b8;
      font-size: 3.6vw;
      font-weight: 700;
    }
    .brand img {
      width: 8.2vw;
      height: 8.2vw;
      border-radius: 2vw;
      box-shadow: 0 1.4vh 4vw rgba(0, 0, 0, .24);
    }
    .copy {
      position: absolute;
      z-index: 4;
      top: 12.4%;
      left: 7%;
      width: 86%;
    }
    h1 {
      margin: 0;
      max-width: 94%;
      font-size: 11.7vw;
      line-height: .96;
      letter-spacing: -.055em;
      font-weight: 790;
    }
    p {
      margin: 2.2vh 0 0;
      color: #a7c0b8;
      font-size: 4.45vw;
      line-height: 1.22;
    }
    .screen {
      position: absolute;
      z-index: 3;
      left: 7vw;
      right: 7vw;
      bottom: 0;
      height: 61vh;
      padding: 1.05vw 1.05vw 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 7.4vw 7.4vw 0 0;
      background: #121c19;
      box-shadow: 0 5vh 15vw rgba(0, 0, 0, .38);
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      border-radius: 6.5vw 6.5vw 0 0;
    }
  </style>
</head>
<body>
  <div class="brand"><img src="{{app_icon}}" alt="">Holder</div>
  <div class="copy">
    <h1 data-kou-id="headline" data-kou-role="headline">{{headline}}</h1>
    <p data-kou-id="subtitle" data-kou-role="supporting">{{subtitle}}</p>
  </div>
  <div class="screen" data-kou-id="device" data-kou-role="device">
    <img src="{{app_screenshot}}" alt="Holder card list">
  </div>
</body>
</html>
