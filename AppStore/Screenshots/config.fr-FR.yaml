project:
  name: "Holder 2.3 French App Store screenshots"
  output_dir: "output/fr-FR"
  device: "iPhone 17 Pro Max - Portrait"
  output_size: "iPhone6_9"
  parallel_workers: 3

screenshots:
  01_cards_together:
    template: "templates/01_cards_together.html"
    frame: false
    variables:
      headline: "Vos cartes. Un espace privé."
      subtitle: "Crédit, débit, pièces d'identité et plus encore."
    assets:
      app_screenshot: "captures/en-US/home.png"
      app_icon: "../../cards/Assets.xcassets/AppIcon.appiconset/1024.png"

  02_scan_card:
    template: "templates/02_scan_card.html"
    frame: false
    variables:
      headline: "Scannez. Évitez la saisie."
      subtitle: "Numéro, nom et date d'expiration préremplis."
    assets:
      app_screenshot: "captures/en-US/scanner-sheet.png"
      app_icon: "../../cards/Assets.xcassets/AppIcon.appiconset/1024.png"

  03_private_details:
    template: "templates/03_private_details.html"
    frame: false
    variables:
      headline: "Conçu pour rester privé."
      subtitle: "Dans le trousseau. Déverrouillé avec Face ID."
    assets:
      app_screenshot: "captures/en-US/card-details.png"
      app_icon: "../../cards/Assets.xcassets/AppIcon.appiconset/1024.png"
