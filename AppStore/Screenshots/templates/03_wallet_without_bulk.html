<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      position: relative;
      color: #f6fbff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background:
        radial-gradient(circle at 7% 72%, rgba(73, 184, 226, .18), transparent 35%),
        linear-gradient(180deg, #071a2d 0%, #020a12 100%);
    }
    .brand {
      position: absolute;
      z-index: 5;
      top: 5.1%;
      left: 7%;
      display: flex;
      align-items: center;
      gap: 2.3vw;
      color: rgba(225, 243, 252, .74);
      font-size: 3.5vw;
      font-weight: 720;
    }
    .brand img { width: 7.7vw; height: 7.7vw; border-radius: 2vw; }
    .copy {
      position: absolute;
      z-index: 5;
      top: 11.6%;
      left: 7%;
      width: 86%;
    }
    h1 {
      margin: 0;
      font-size: 11.7vw;
      line-height: .95;
      letter-spacing: -.052em;
      font-weight: 790;
    }
    p {
      margin: 2.5vh 0 0;
      width: 78%;
      color: rgba(225, 243, 252, .66);
      font-size: 4.3vw;
      line-height: 1.28;
    }
    .device {
      position: absolute;
      z-index: 3;
      left: 12vw;
      bottom: -6vh;
      width: 82vw;
      height: 68vh;
      padding: 1.05vw;
      overflow: hidden;
      border: 1px solid rgba(171, 224, 247, .25);
      border-radius: 8.4vw;
      transform: rotate(3deg);
      background: #030508;
      box-shadow: 0 4vh 14vw rgba(0, 0, 0, .56);
    }
    .device img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      border-radius: 7.3vw;
    }
    .glow {
      position: absolute;
      z-index: 2;
      width: 62vw;
      height: 62vw;
      right: -15vw;
      bottom: 10vh;
      border-radius: 50%;
      background: rgba(75, 189, 232, .12);
      filter: blur(4vw);
    }
  </style>
</head>
<body>
  <div class="brand"><img src="{{app_icon}}" alt="">Holder</div>
  <div class="copy">
    <h1 data-kou-id="headline" data-kou-role="headline">{{headline}}</h1>
    <p data-kou-id="subtitle" data-kou-role="supporting">{{subtitle}}</p>
  </div>
  <div class="glow"></div>
  <div class="device">
    <img data-kou-id="device" data-kou-role="device" src="{{app_screenshot}}" alt="Privacy settings in Holder">
  </div>
</body>
</html>
