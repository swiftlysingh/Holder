<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="framed.css">
  <style>
    body {
      color: #103b32;
      background:
        radial-gradient(circle at 88% 8%, rgba(255, 255, 255, .48), transparent 25%),
        #b7f3cf;
    }
    .brand, p { color: #3f6b5d; }
    .brand img { box-shadow: 0 1.4vh 4vw rgba(16, 59, 50, .17); }
    /* The scanner sheet sits in the lower half of the screen, so show the
       whole phone instead of letting it run off the edge. */
    .device { top: 31vh; bottom: 3vh; overflow: visible; }
    .device img {
      width: auto;
      height: 100%;
      filter: drop-shadow(0 3vh 5vw rgba(16, 59, 50, .28));
    }
  </style>
</head>
<body>
  <div class="brand"><img src="app-icon.png" alt="">Holder</div>
  <div class="copy">
    <h1 data-kou-id="headline" data-kou-role="headline">{{headline}}</h1>
    <p data-kou-id="subtitle" data-kou-role="supporting">{{subtitle}}</p>
  </div>
  <div class="device" data-kou-id="device" data-kou-role="device">
    <img src="{{app_screenshot}}" alt="Holder's card scanner">
  </div>
</body>
</html>
