<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      position: relative;
      color: #07182a;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background:
        radial-gradient(circle at 89% 13%, rgba(73, 184, 226, .34), transparent 28%),
        linear-gradient(160deg, #f2fbff 0%, #dcedf5 100%);
    }
    .mark {
      position: absolute;
      z-index: 5;
      top: 5.2%;
      right: 7%;
      width: 9vw;
      height: 9vw;
      border-radius: 2.35vw;
      box-shadow: 0 2vh 5vw rgba(7, 24, 42, .18);
    }
    .copy {
      position: absolute;
      z-index: 4;
      top: 6.7%;
      left: 7%;
      width: 85%;
    }
    .eyebrow {
      margin: 0 0 2.2vh;
      color: #1c6a91;
      font-size: 2.9vw;
      line-height: 1;
      letter-spacing: .16em;
      font-weight: 800;
    }
    h1 {
      margin: 0;
      width: 86%;
      font-size: 10.7vw;
      line-height: .98;
      letter-spacing: -.052em;
      font-weight: 790;
    }
    p {
      margin: 2.5vh 0 0;
      width: 72%;
      color: rgba(7, 24, 42, .64);
      font-size: 4.3vw;
      line-height: 1.28;
    }
    .focus-card {
      position: absolute;
      z-index: 3;
      left: 6vw;
      right: 6vw;
      bottom: 5vh;
      height: 57.5vh;
      overflow: hidden;
      border: 1px solid rgba(9, 52, 78, .13);
      border-radius: 7vw;
      background: #000;
      box-shadow: 0 4vh 13vw rgba(27, 74, 100, .24);
    }
    .focus-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
    }
    .focus-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img class="mark" src="{{app_icon}}" alt="Holder">
  <div class="copy">
    <div class="eyebrow" data-kou-id="eyebrow" data-kou-role="supporting">{{eyebrow}}</div>
    <h1 data-kou-id="headline" data-kou-role="headline">{{headline}}</h1>
    <p data-kou-id="subtitle" data-kou-role="supporting">{{subtitle}}</p>
  </div>
  <div class="focus-card">
    <img data-kou-id="device" data-kou-role="device" src="{{app_screenshot}}" alt="Card details in Holder">
  </div>
</body>
</html>
