project:
  name: "Holder screenshot concepts"
  output_dir: "output"
  device: "iPhone 16 Pro - Black Titanium - Portrait"
  output_size: "iPhone6_9"
  parallel_workers: 3

screenshots:
  01_every_card:
    template: "templates/01_every_card.html"
    frame: false
    variables:
      headline: "Every card. One private place."
      subtitle: "Keep the details you need close without carrying the whole wallet."
    assets:
      app_screenshot: "captures/en-US/home.png"
      app_icon: "../../cards/Assets.xcassets/AppIcon.appiconset/1024.png"

  02_masked_at_a_glance:
    template: "templates/02_masked_at_a_glance.html"
    frame: false
    variables:
      eyebrow: "DETAILS ON DEMAND"
      headline: "All the details. No digging."
      subtitle: "Open a card and find what you need in seconds."
    assets:
      app_screenshot: "captures/en-US/card-details.png"
      app_icon: "../../cards/Assets.xcassets/AppIcon.appiconset/1024.png"

  03_wallet_without_bulk:
    template: "templates/03_wallet_without_bulk.html"
    frame: false
    variables:
      headline: "Your vault. Your rules."
      subtitle: "Choose authentication, lock timing, and how much each card reveals."
    assets:
      app_screenshot: "captures/en-US/settings.png"
      app_icon: "../../cards/Assets.xcassets/AppIcon.appiconset/1024.png"
